apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-app
  namespace: default
spec:
  replicas: 2

  selector:
    matchLabels:
      app: bank-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: bank-app

    spec:
      containers:
        - name: bank-app
          image: bank-app:1.0

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: bank-config
            - secretRef:
                name: bank-secrets

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 18

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3