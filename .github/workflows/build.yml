name: Build and Test Bank API

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest

    env:
      CVV_ENCRYPTION_KEY: ${{ secrets.CVV_ENCRYPTION_KEY }}
      TEST_JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}

      BANK_NOTIFICATION_EMAIL: test@example.com

      MAIL_HOST: localhost
      MAIL_PORT: 2525
      MAIL_USERNAME: test
      MAIL_PASSWORD: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'




      - name: Build with Maven
        run: mvn clean test