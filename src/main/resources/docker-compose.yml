services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: bank-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - bank-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - bank-network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bank-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - bank-network

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3


  # ── ZooKeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: bank-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    networks:
      - bank-network

    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 30"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Kafka ───────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: bank-kafka

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Внутренний listener для Docker
      # Внешний listener для Windows/localhost
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    networks:
      - bank-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:29092"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  # ── Spring Boot приложение ─────────────────────────────────
  app:
    build:
      context: ../../../
      dockerfile: Dockerfile

    container_name: bank-app

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # PostgreSQL
      DATABASE_URL: jdbc:postgresql://postgres:5432/bank
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASS}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      BANK_NOTIFICATION_EMAIL: ${BANK_NOTIFICATION_EMAIL}

      # JWT
      BANK_JWT_SECRET: ${BANK_JWT_SECRET}
      BANK_JWT_EXPIRATION_MS: ${BANK_JWT_EXPIRATION_MS}

      # CVV
      CVV_ENCRYPTION_KEY: ${CVV_ENCRYPTION_KEY}

    ports:
      - "8080:8080"

    networks:
      - bank-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    restart: on-failure

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  #Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: bank-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    networks:
      - bank-network

    depends_on:
      app:
        condition: service_healthy

  #GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: bank-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    networks:
      - bank-network

    depends_on:
      prometheus:
        condition: service_started

# ── Volumes ──────────────────────────────────────────────────
volumes:
  bank-data:
    driver: local

  redis-data:
    driver: local

  grafana-data:
    driver: local


# ── Network ──────────────────────────────────────────────────
networks:
  bank-network:
    driver: bridge